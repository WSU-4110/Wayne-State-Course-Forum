<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSU Course Forum</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

 
<!-- New Wayne State Course Forum Navigation -->
<header class="site-header">
  <div class="header-left">
    <a href="index.html" class="site-brand">
      <span class="brand-name">Wayne State University</span>
      <span class="brand-subtitle">Course Forum</span>
    </a>

    <nav class="main-navigation" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="search.html">Search Courses</a>
      <a href="index.html#news">News</a>
    </nav>
  </div>

  <nav class="account-navigation" aria-label="Account">
    <!-- Visible when logged out -->
    <span id="guestLinks">
      <a href="login.html">Log In</a>
      <a href="signup.html" class="signup-button">Sign Up</a>
    </span>

    <!-- Visible when logged in -->
    <span id="userAccount" hidden>
      <span id="userGreeting"></span>
      <button id="logoutBtn" type="button">Log Out</button>
    </span>
  </nav>
</header>

  <!-- Main part of the page -->
  <main>
    <h1>Find a WSU course</h1>
    <p>Read what other students say about workload, tips, and what to know before you take it.</p>

  <!-- Search bar. Nick's search code will read the "course" value. -->
  <form id="course-search-form" action="course.html" method="get">
  <label for="subject">Subject</label>
  <select id="subject" required>
    <option value="">Select a subject</option>
    <option value="CSC">CSC - Computer Science</option>
    <option value="MAT">MAT - Mathematics</option>
    <option value="BIO">BIO - Biology</option>
    <option value="CHM">CHM - Chemistry</option>
    <option value="PHY">PHY - Physics</option>
  </select>

  <label for="course-number">Course Number</label>
  <input
    type="text"
    id="course-number"
    placeholder="e.g. 4110"
    inputmode="numeric"
    pattern="[0-9]+"
    required
  >

  <input type="hidden" id="course-search" name="course">

  <button type="submit">Search</button>
</form>


<script>
const form = document.getElementById("course-search-form");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    //get dropdown
    const subject = document.getElementById("subject").value;
    const number = document.getElementById("course-number").value.trim();

    // build api request see courses.js in backend
    const url = new URL(
        "https://wayne-state-course-forum.onrender.com/api/courses/validate"
    );

    url.searchParams.set("subject", subject);
    url.searchParams.set("number", number);

    try {
        // validates if exists
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Validation request failed");
        }

        const result = await response.json();

        if (result.valid) {
            // open if exist
            const params = new URLSearchParams({
                course: subject + " " + number
            });

            window.location.href = "course.html?" + params.toString();

        } else {
            // Course does not exist
            alert("Course not found. Please check the course number.");
        }

    } catch (error) {
        console.error("Validation error:", error);
        alert("Unable to validate course. Please try again.");
    }
});
</script>


  </main>

  <footer>
    <p>Made by WSU students for CSC 4110.</p>
  </footer>
<script src="../js/auth.js"></script>
</body>
</html>
