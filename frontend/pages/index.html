  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSU Course Forum</title>
</head>
<body>

  <!-- Top bar: site name + links. Same on every page (issue #9). -->

    <a href="index.html">WSU Course Forum</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>

  <!-- Main part of the page -->

    <h1>Find a WSU course</h1>

    <!-- Search bar. Nick's search code will read the "course" value. -->
    <form action="course.html" method="get">
      <label for="course-search">Course code</label>
      <input type="text" id="course-search" name="course" placeholder="e.g. CSC 4110" required>
      <button type="submit">Search</button>
    </form>

    <p>Made by WSU students for CSC 4110.</p>
