<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Courses | WSU Course Forum</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Wayne State Course Forum Navigation -->
  <header class="site-header">
    <div class="header-left">

      <a href="index.html" class="site-brand">
        <span class="brand-name">Wayne State University</span>
        <span class="brand-subtitle">Course Forum</span>
      </a>

      <nav class="main-navigation" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="search.html">Search Courses</a>
        <a href="index.html#news">News</a>
      </nav>

    </div>

    <nav class="account-navigation" aria-label="Account">

      <!-- Visible when logged out -->
      <span id="guestLinks">
        <a href="login.html">Log In</a>
        <a href="signup.html" class="signup-button">Sign Up</a>
      </span>

      <!-- Visible when logged in -->
      <span id="userAccount" hidden>
        <span id="userGreeting"></span>
        <a href="profile.html" id="myProfileLink">My Profile</a>
        <button id="logoutBtn" type="button">Log Out</button>
      </span>

    </nav>
  </header>

  <!-- Main part of the page -->
  <main>
    <h1>Find a WSU course</h1>
    <p>Read what other students say about workload, tips, and what to know before you take it.</p>

  <!-- Search bar. Nick's search code will read the "course" value. -->
  <form id="course-search-form" action="course.html" method="get">
  <label for="subject">Subject</label>
  <select id="subject" required>
    <option value="">Select a subject</option>
    <option value="OTHER">Other (enter subject)</option>
  </select>

  <input 
    type = "text"
    id = "custom-subject"
    placeholder = "Enter subject code (e.g. CSC)"
    maxlength = "3"
    pattern = "[A-Za-z]{2,3}"
    hidden
    >


  <label for="course-number">Course Number</label>
  <input
    type="text"
    id="course-number"
    placeholder="e.g. 4110"
    inputmode="numeric"
    pattern="[0-9]+"
    required
  >

  <input type="hidden" id="course-search" name="course">

  <button type="submit">Search</button>
</form>


<script>
const form = document.getElementById("course-search-form");
const subjectSelect = document.getElementById("subject");
const customSubject = document.getElementById("custom-subject");

async function loadSubjects() { 
  try {
        const response = await fetch(
            "https://wayne-state-course-forum.onrender.com/api/courses/subjects"
        );

        if (!response.ok) {
            throw new Error("Failed to fetch subjects");
        }

        const subjects = await response.json();

        const otherOption = subjectSelect.querySelector(
            'option[value="OTHER"]'
        );

        subjects.forEach(course => {
            const option = document.createElement("option");

            option.value = course.subject;
            option.textContent = course.subject;

            subjectSelect.insertBefore(option, otherOption);
        });

    } catch (error) {
        console.error("Error loading subjects:", error);
    }
}

loadSubjects();

subjectSelect.addEventListener("change", function() {
    const isOther = subjectSelect.value === "OTHER";

    customSubject.hidden = !isOther;
    customSubject.required = isOther;

    if (!isOther) {
        customSubject.value = "";
    }
});

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    //get dropdown
    const subject = (
    subjectSelect.value === "OTHER"
        ? customSubject.value
        : subjectSelect.value
).trim().toUpperCase();
    const number = document.getElementById("course-number").value.trim();

    // build api request see courses.js in backend
    const url = new URL(
        "https://wayne-state-course-forum.onrender.com/api/courses/validate"
    );

    url.searchParams.set("subject", subject);
    url.searchParams.set("number", number);

    try {
        // validates if exists
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Validation request failed");
        }

        const result = await response.json();

        if (result.valid) {
            // open if exist
            const params = new URLSearchParams({
                course: subject + " " + number
            });

            window.location.href = "course.html?" + params.toString();

        } else {
            // Course does not exist
            alert("Course not found. Please check the course number.");
        }

    } catch (error) {
        console.error("Validation error:", error);
        alert("Unable to validate course. Please try again.");
    }
});
</script>


  </main>

  <footer>
    <p>Made by WSU students for CSC 4110.</p>
  </footer>
<script src="../js/auth.js"></script>
</body>
</html>
