<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Courses | WSU Course Forum</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Top bar: site name + links. Same on every page (issue #9). -->
  <header>
    <a href="index.html">WSU Course Forum</a>
    <nav>
      <!--when not logged in -->
    
      <span id="guestLinks">
            <a href="index.html">Home</a>
            <a href="login.html">Log in</a>
            <a href="signup.html">Sign up</a>
      </span>

      <!--when logged in-->
      <span id="userAccount" hidden>
            <span id="userGreeting"></span>
            <a href="index.html">Home</a>
            <button id="logoutBtn" type="button">Log Out</button>
      </span>
    </nav>
  </header>

  <!-- Main part of the page -->
  <main>
    <h1>Find a WSU course</h1>
    <p>Read what other students say about workload, tips, and what to know before you take it.</p>

  <!-- Search bar. Nick's search code will read the "course" value. -->
  <form id="course-search-form" action="course.html" method="get">
  <label for="subject">Subject</label>
  <select id="subject" required>
    <option value="">Select a subject</option>
    <option value="CSC">CSC - Computer Science</option>
    <option value="MAT">MAT - Mathematics</option>
    <option value="BIO">BIO - Biology</option>
    <option value="CHM">CHM - Chemistry</option>
    <option value="PHY">PHY - Physics</option>
  </select>

  <input 
    type = "text"
    id = "custom-subject"
    placeholder = "Enter subject code (e.g. CSC)"
    maxlength = "3"
    pattern = "[A-Za-z]{2,3}"
    hidden
    >


  <label for="course-number">Course Number</label>
  <input
    type="text"
    id="course-number"
    placeholder="e.g. 4110"
    inputmode="numeric"
    pattern="[0-9]+"
    required
  >

  <input type="hidden" id="course-search" name="course">

  <button type="submit">Search</button>
</form>


<script>
const form = document.getElementById("course-search-form");
const subjectSelect = document.getElementById("subject");
const customSubject = document.getElementById("custom-subject");

subjectSelect.addEventListener("change", function() {
    const isOther = subjectSelect.value === "OTHER";

    customSubject.hidden = !isOther;
    customSubject.required = isOther;

    if (!isOther) {
        customSubject.value = "";
    }
});

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    //get dropdown
    const subject = (
    subjectSelect.value === "OTHER"
        ? customSubject.value
        : subjectSelect.value
).trim().toUpperCase();
    const number = document.getElementById("course-number").value.trim();

    // build api request see courses.js in backend
    const url = new URL(
        "https://wayne-state-course-forum.onrender.com/api/courses/validate"
    );

    url.searchParams.set("subject", subject);
    url.searchParams.set("number", number);

    try {
        // validates if exists
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Validation request failed");
        }

        const result = await response.json();

        if (result.valid) {
            // open if exist
            const params = new URLSearchParams({
                course: subject + " " + number
            });

            window.location.href = "course.html?" + params.toString();

        } else {
            // Course does not exist
            alert("Course not found. Please check the course number.");
        }

    } catch (error) {
        console.error("Validation error:", error);
        alert("Unable to validate course. Please try again.");
    }
});
</script>


  </main>

  <footer>
    <p>Made by WSU students for CSC 4110.</p>
  </footer>
<script src="../js/auth.js"></script>
</body>
</html>
